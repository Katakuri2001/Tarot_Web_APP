name = "velora-tarot-admin"
main = "worker/src/index.ts"
compatibility_date = "2024-09-30"

# D1 and R2 bindings require actual Cloudflare resource IDs
# Create D1 database: npx wrangler d1 create velora-db
# Create R2 bucket: npx wrangler r2 bucket create velora-images
# Then update this file with the actual IDs

[vars]
JWT_ISSUER = "velora-admin"
TOKEN_TTL_SECONDS = "43200"
MAX_IMAGE_BYTES = "5242880"